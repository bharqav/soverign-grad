name: SovereignGrad CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Configure CMake (CPU Emulation)
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_CUDA=OFF

    - name: Build project
      run: cmake --build build --config Release

    - name: Run Core Unit Tests
      run: ./build/sovereign_grad
